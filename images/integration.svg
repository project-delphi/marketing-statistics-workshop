<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 570" width="372" height="570" role="img" aria-labelledby="ig-title ig-desc" class="ig">
<title id="ig-title">How the parts of the workshop connect</title>
<desc id="ig-desc">Three lanes, read from top to bottom, each ending in a business decision. Customer value, the middle lane: transaction logs are summarized as recency, frequency and monetary value (RFM) and fitted with BG/NBD or Pareto/NBD models and the Gamma-Gamma spend model, giving customer lifetime value (CLV) with intervals, which decides whom to retain and what a customer is worth. Media and lift, the left lane: geo tests give sales by region; synthetic control, CausalImpact and GeoLift compare them with a counterfactual to measure the lift; the measured lift enters the Bayesian marketing mix model (MMM) as priors or likelihood terms; the model's response curves drive the allocator, which decides what to spend where. Targeting, the right lane: randomized experiments, treated against control, train uplift models (causal forests, meta-learners) that estimate the effect per customer; customers are ranked by uplift, and the discount goes where uplift times margin exceeds its cost. CLV connects the lanes: it feeds the allocator's long-run objective and the margin used in targeting.</desc>
<style>
