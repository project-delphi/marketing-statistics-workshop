# Monthly check of every link on the live site, external ones included. Non-blocking: it runs
# apart from publish.yml, so a dead link elsewhere never holds up a deploy; a failed run and its
# job summary list what broke. publish.yml checks internal links on every build.
name: links

on:
  schedule:
    - cron: "41 5 1 * *" # the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: pages
        name: Pages in the live site's sitemap
        run: |
          site=$(sed -n -E 's/^[[:space:]]*site-url:[[:space:]]*//p' _quarto.yml)
          # Assign first so a failed download fails the step instead of checking nothing.
          sitemap=$(curl -sfL --retry 3 "${site%/}/sitemap.xml")
          pages=$(grep -o '<loc>[^<]*' <<< "$sitemap" | sed 's/<loc>//' | tr '\n' ' ')
          if [ -z "${pages// }" ]; then echo "::error::No pages in ${site%/}/sitemap.xml"; exit 1; fi
          echo "Checking $(wc -w <<< "$pages") pages."
          echo "list=${pages}" >> "$GITHUB_OUTPUT"
      # 403 is accepted: journal publishers behind doi.org refuse non-browser clients with 403
      # (checked 2026-10-10); a wrong DOI still fails, because doi.org itself answers 404. Data
      # URLs are covered by the weekly notebooks run, which downloads them.
      # online.stat.psu.edu sends an incomplete certificate chain, which browsers repair and
      # lychee rejects; its pages loaded with curl on macOS on 2026-10-10.
      - name: Links on every page
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 3
            --accept 200,203,206,403,429
            --exclude '^https://colab\.research\.google\.com/'
            --exclude '^https://online\.stat\.psu\.edu/'
            ${{ steps.pages.outputs.list }}
          fail: true
