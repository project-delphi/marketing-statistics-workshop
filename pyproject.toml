[project]
name = "mktstats"
version = "0.1.0"
description = "Data loaders, seeded synthetic generators with known truth, checks and the exercise harness for the Statistics for Marketing workshop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Kept light on purpose: Colab already has these. Heavy libraries (pymc-marketing, econml)
# are imported lazily inside functions and installed by each notebook from the pinned
# environment/requirements.txt, so importing mktstats never preloads an old pymc.
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13"]

[project.urls]
Homepage = "https://project-delphi.github.io/marketing-statistics-workshop/"
Source = "https://github.com/project-delphi/marketing-statistics-workshop"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mktstats"]

[tool.hatch.build.targets.sdist]
include = ["src/mktstats", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["labs/python", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Jupytext percent sources: notebook-style imports and top-level expressions, names the
# harness defines (F821), and the exercise pattern: a stub, then its reference (F811).
"labs/src/*.py" = ["E402", "F821", "F811", "B018", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: model fits (minutes); run with -m slow"]
addopts = "-m 'not slow'"
