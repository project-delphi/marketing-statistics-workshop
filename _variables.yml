# Single source of truth for the workshop. Pages read it through {{< var ... >}} and the
# includes that scripts/gen_tables.py writes; notebooks through scripts/gen_notebooks.py.
# Ownership of keys: see AGENTS.md ("Who owns what"). Do not duplicate these facts elsewhere.

workshop:
  title: "Statistics for Marketing"
  subtitle: "Sales growth and customer lifetime value, with uncertainty"
  short: "Stats for Marketing"
  org: "Genial Labs"
  audience: "Marketing analysts, data scientists and analytics engineers who know Python or R basics, linear and logistic regression, and SQL."
  length: "five days"
  # One paragraph for the landing page and README.
  lead: "Five days from a raw transaction log to a budget and a targeting list. Each day answers one business question, each module fixes something the previous one could not do, and every lab ends in a decision stated with its uncertainty."
  # The running story every lab returns to (data from mktstats.synth, truth in data/synthetic/truth.json).
  story: "One synthetic online retailer runs through the whole week. Its customers arrive through different acquisition channels, buy at their own pace and leave without telling anyone; it sends email offers, runs a regional campaign and spends on TV, search, social and display. We generated it, so we know the true answers, and every method is scored against that truth before you use it on real data."

repo:
  owner: project-delphi
  name: marketing-statistics-workshop
  url: https://github.com/project-delphi/marketing-statistics-workshop
  site: https://project-delphi.github.io/marketing-statistics-workshop/
  # Colab badges, the mktstats install, the constraints file and the R helpers all point at this
  # ref. `main` while building; a release tag when the workshop is frozen for delivery. Changing
  # it changes every notebook's deps_sha, so every run record goes stale (DECISIONS.md).
  # A notebook added after this ref is cut is not in it, so its Colab link would not open:
  # its entry in modules.*.notebooks says `in_ref: false` until ref moves to a tag that contains
  # it (see the `notebooks` comment under m00, and CONTRIBUTING.md).
  ref: v2026.10.1
  # The branch that collects run records and builds the site; records added after the tag live here.
  branch: main
  raw: https://raw.githubusercontent.com/project-delphi/marketing-statistics-workshop
  colab_base: https://colab.research.google.com/github/project-delphi/marketing-statistics-workshop/blob

environment:
  python: "3.13"
  r: "4.6.1"
  quarto: "1.10.19"
  # Dated Posit Public Package Manager snapshot used by the Docker image and the Colab R notebooks.
  p3m_snapshot: "2026-10-01"
  p3m_url: https://p3m.dev/cran/__linux__/noble/2026-10-01
  colab_runtime: "Colab default runtime as of 2026-10 (Ubuntu 24.04.5, Python 3.13.16, R 4.6.1)"
  colab_backend_info: https://github.com/googlecolab/backend-info
  image: ghcr.io/project-delphi/marketing-statistics-workshop/env

# Python packages the labs install on Colab, with the docs or source each was checked against.
# Versions must agree with environment/requirements.txt (tests/test_variables.py).
packages:
  pymc-marketing: {version: "1.2.0", checked: 2026-10-10, against: "installed source pymc_marketing 1.2.0 (signatures of MMM, BetaGeoModel, ParetoNBDModel, GammaGammaModel, ShiftedBetaGeoModel, rfm_summary, rfm_train_test_split, expected_customer_lifetime_value, add_lift_test_measurements, budget_optimizer; 2026-10-10: clv/distributions.py BetaGeoNBD.logp, clv/models/gamma_gamma.py GammaGammaModel.build_model and expected_customer_spend, clv/models/beta_geo.py BetaGeoModel.expected_purchases, transcribed in mktstats.mle and tested against them); Module 17, 2026-10-10: mmm/mmm.py MMM(time_varying_media: bool | HSGPBase) (an HSGPBase instance keeps its own dims, so dims=(date, channel) gives one multiplier per channel; True gives one shared multiplier, dims (date,)), mmm/hsgp.py SoftPlusHSGP.parameterize_from_data(X, dims, X_mid=None, eta_mass=0.05, eta_upper=1.0, ls_lower=1.0, ls_upper=None, ls_mass=0.9, cov_func=CovFunc.ExpQuad, centered=False, drop_first=True) and create_variable (softplus divided by its mean over date), mmm/tvp.py (Matern 5/2 when cov_func is None), mmm/incrementality.py contribution_over_spend (window clamped to the fitted dates), mmm/lift_test.py exact_row_indices and create_time_varying_saturation (a time-varying lift row needs a date equal to a model date)", docs: https://www.pymc-marketing.io/}
  econml: {version: "0.17.0", checked: 2026-10-10, against: "https://github.com/py-why/EconML/blob/v0.17.0/econml/dml/causal_forest.py (Module 11); for Module 15 the installed source of econml/dml/dml.py (LinearDML.__init__ and fit, _FirstStageWrapper, sensitivity_interval, robustness_value), econml/_ortho_learner.py (cv: an iterable of splits is used as given), econml/_cate_estimator.py (ate, ate_interval, intercept__inference), econml/inference/_inference.py (StatsModelsInference cov_type='HC1' by default), econml/dml/_rlearner.py (nuisance_scores_y/_t), econml/dr/_drlearner.py (LinearDRLearner)", docs: https://www.pywhy.org/EconML/}
  nutpie: {version: "0.16.11", checked: 2026-10-09, against: "PyPI", docs: https://pymc-devs.github.io/nutpie/}
  # Extension modules. Colab preinstalls prophet 1.4.0 (environment/colab-constraints.txt); lifelines is a pure-Python wheel.
  lifelines: {version: "0.30.3", checked: 2026-10-10, against: "PyPI metadata (pure-Python wheel, requires_python >=3.11, uploaded 2026-03-05; needs autograd-gamma 0.5.0, pinned in requirements.txt); imports on Python 3.13; installed source lifelines 0.30.3, read again for the Module 14 build on 2026-10-10: fitters/kaplan_meier_fitter.py (KaplanMeierFitter(alpha); fit/_fit; survival_function_ = exp(cumsum(log(1 - d/n))) from utils _additive_estimate, index 0 plus every distinct duration; confidence_interval_ from _bounds, exponential Greenwood, pointwise), fitters/__init__.py (UnivariateFitter.predict = asof, flat past the data), utils/__init__.py (restricted_mean_survival_time exact step integral up to t, return_variance = variance of min(T, t); _preprocess_inputs), fitters/coxph_fitter.py (CoxPHFitter(alpha) via BaseFitter, fit(df, duration_col, event_col) uses every other column, breslow -> SemiParametricPHFitter, confidence_intervals_ on the log scale with columns '95% lower-bound' and '95% upper-bound', summary), fitters/mixins.py (hazard_ratios_ = exp(params_), check_assumptions), statistics.py (proportional_hazard_test with time_transform rank; StatisticalResult.summary sorted by name; logrank_test, multivariate_logrank_test)", docs: https://lifelines.readthedocs.io/}
  prophet: {version: "1.4.0", checked: 2026-10-10, against: "PyPI metadata (wheels for manylinux x86_64 and aarch64, macOS arm64); installed source prophet/forecaster.py (Prophet defaults n_changepoints=25, changepoint_range=0.8, changepoint_prior_scale=0.05; predict() returns trend, yearly, holidays, additive_terms and yhat = trend * (1 + multiplicative_terms) + additive_terms; add_regressor); fitted on Python 3.13 locally (156 weekly rows, 0.04-0.16 s, identical results on repeated fits); Module 17, 2026-10-10: Prophet(yearly_seasonality=True, weekly_seasonality=False, daily_seasonality=False, holidays=, uncertainty_samples=0), predict(df) columns trend, yearly, holidays, yhat (trend + yearly + holidays = yhat to 1.2e-10 on the lab data); the prophet logger and cmdstanpy log at INFO level (forecaster.py, models.py)", docs: https://facebook.github.io/prophet/}

# R packages (versions come from the P3M snapshot; recorded here after the image build).
r_packages:
  CLVTools: {version: "0.12.1", docs: https://cran.r-project.org/package=CLVTools}
  grf: {version: "2.6.1", docs: https://grf-labs.github.io/grf/}
  CausalImpact: {version: "1.4.1", docs: https://google.github.io/CausalImpact/}
  bsts: {version: "0.9.11", docs: https://cran.r-project.org/package=bsts}

# GitHub-only R packages, installed from archive tarballs at pinned commits (no GitHub API call).
github_packages:
  augsynth: {repo: ebenmichael/augsynth, sha: 7e70072232fe75057aa8b5d7af08c7e1aef53ae8, license: MIT}
  GeoLift: {repo: facebookincubator/GeoLift, sha: db34ea4299ff0e28515ebac502b78c076c93c905, license: MIT}

# Days: each day answers one question. `blocks` drive the generated timetable and clocks.
# A module block without `part` is the whole module (briefing, lab, debrief in a row). With
# `part: briefing|lab|debrief` it is that part only; a part may be split over several blocks
# with `minutes:` (the segments must add up to the module's minutes for that part).
days:
  d0:
    label: "Before Day 1"
    title: "Pre-work"
    question: "Is my environment ready, and can I count purchases per customer in pandas, SQL or dplyr?"
    blocks: []
  d1:
    label: "Day 1"
    title: "Customers and churn"
    question: "Who are our customers, and who is still with us?"
    start: "09:00"
    blocks:
      - {kind: warmup, minutes: 15}
      - {kind: module, id: m01}
      - {kind: break, minutes: 15}
      - {kind: module, id: m02}
      - {kind: lunch, minutes: 55}
      - {kind: module, id: m03}
      - {kind: break, minutes: 10}
      - {kind: wrapup, minutes: 20}
  d2:
    label: "Day 2"
    title: "What a customer is worth"
    question: "What is a customer worth, in money, with uncertainty?"
    start: "09:00"
    blocks:
      - {kind: warmup, minutes: 15}
      - {kind: module, id: m04}
      - {kind: break, minutes: 15}
      - {kind: module, id: m05, part: briefing}
      - {kind: lunch, minutes: 60}
      - {kind: module, id: m05, part: lab}
      - {kind: module, id: m05, part: debrief}
      - {kind: clinic, minutes: 60, title: "CFO memo clinic: peer review of the Module 5 decision memo"}
      - {kind: break, minutes: 10}
      - {kind: wrapup, minutes: 20}
  d3:
    label: "Day 3"
    title: "Incrementality"
    question: "Did the marketing cause the sales?"
    start: "09:00"
    blocks:
      - {kind: warmup, minutes: 15}
      - {kind: module, id: m06}
      - {kind: break, minutes: 15}
      - {kind: module, id: m07, part: briefing}
      - {kind: lunch, minutes: 60}
      - {kind: module, id: m07, part: lab}
      - {kind: module, id: m07, part: debrief}
      - {kind: clinic, minutes: 60, title: "Geo-test design review, with the GeoLift market-selection demo"}
      - {kind: break, minutes: 10}
      - {kind: wrapup, minutes: 20}
  d4:
    label: "Day 4"
    title: "Where the next dollar goes"
    question: "Where should the next dollar go?"
    start: "09:00"
    blocks:
      - {kind: warmup, minutes: 15}
      - {kind: module, id: m08}
      - {kind: break, minutes: 15}
      - {kind: module, id: m09}
      - {kind: lunch, minutes: 55}
      - {kind: module, id: m10}
      - {kind: break, minutes: 10}
      - {kind: wrapup, minutes: 20}
  d5:
    label: "Day 5"
    title: "Targeting and the plan"
    question: "Whom should we target, and what is the plan for next quarter?"
    start: "09:00"
    blocks:
      - {kind: warmup, minutes: 15}
      - {kind: module, id: m11}
      - {kind: break, minutes: 15}
      - {kind: module, id: m12, part: briefing}
      - {kind: module, id: m12, part: lab, minutes: 80, title: "Pair work: CLV forecasts and the geo test"}
      - {kind: lunch, minutes: 50}
      - {kind: module, id: m12, part: lab, minutes: 100, title: "Pair work: calibrated MMM, allocation, targeting, the 5-slide brief"}
      - {kind: break, minutes: 10}
      - {kind: module, id: m12, part: debrief, title: "Presentations and scoring"}
      - {kind: wrapup, minutes: 20}
  # Extensions: optional modules outside the five timed days, done on your own after the week
  # or swapped into a custom schedule (each keeps the 45-55 / 55 / 10 module format).
  # `track` (Technical Expert): a day without it is the core workshop. Modules on a day with
  # `track: extensions` are counted, judged for readiness and released separately from the
  # core (scripts/readiness.py, scripts/release_check.py --extensions); the day's page is
  # extensions.qmd (<track>.qmd).
  d6:
    track: extensions
    label: "Extensions"
    title: "Beyond the core week"
    question: "What changes when the data are messy, observational, path-shaped or drifting?"
    blocks: []

# Modules. minutes: briefing / lab / debrief. Content keys are filled by the Academic Director;
# notebooks/deps/data by the Technical Expert. Content keys and their types:
#   title, summary (one sentence), decision (one sentence), language_why, recap, next: strings
#   objectives (3-5, each starts with a checkable verb), outcomes ("What you will build"),
#   prerequisites ("Before you start"): lists of strings
# recap = what the previous module left unsolved, which this module fixes;
# next = what this module still cannot do, which the next module fixes.
# Lab briefs with exercises, checkpoints and run settings: briefs/NN-slug.md.
modules:
  m00:
    slug: 00-prework
    title: "Pre-work: environment, warm-up and coding agents"
    day: d0
    optional: true
    minutes: {briefing: 0, lab: 60, debrief: 0}
    language: [python, r]
    language_why: "Both. Python is the main harness for the week; the R notebook checks the R runtime that Modules 3, 7 and 11 use, so you find out now, not on Day 1, whether it works for you."
    summary: "Check that your environment runs, turn a raw transaction log into a customer table in DuckDB SQL and in pandas (or dplyr), and see how to check code that a coding agent wrote."
    objectives:
      - "Run the environment check on Colab or locally and read what its report says."
      - "Build a one-row-per-customer table from a transaction log with DuckDB SQL (GROUP BY, MIN, MAX, COUNT, SUM)."
      - "Rebuild the same table in pandas (or dplyr in R) and check that the two agree."
      - "Count repeat purchases on distinct days, not rows, and explain why the difference matters for later models."
      - "Verify code written by a coding agent with a checkpoint before you trust it."
    outcomes:
      - "A working Colab or local environment with the workshop's pinned packages"
      - "Three checkpoint-tested functions that turn the CDNOW transaction log into a customer table"
      - "A note of where you will run the labs and whether you will do the R notebooks"
    prerequisites:
      - "Python or R basics: functions, data frames, loops"
      - "SQL SELECT, GROUP BY and JOIN"
      - "A Google account for Colab, or Docker for the local image (see Setup)"
    decision: "Decide where you will run the labs (Colab, local Docker or AWS) and whether you will do the R notebooks, based on an environment check that actually ran."
    recap: "This is the starting point; no earlier module."
    next: "A transaction log says what customers did, not who is still a customer. Module 1 builds the customer table and shows why churn is never recorded when customers can leave silently."
    # install: what the install cell makes sure of. Python: versions from `packages`, else
    # environment/requirements.txt. R: CRAN packages from the P3M snapshot, `github_packages`
    # from their pinned archives (jsonlite is always added for R/mktstats.R).
    # in_ref: false: repo.ref does not contain this notebook (it was added after the tag), so
    # the generated pages show a "Colab after the next release" chip linking to the local setup,
    # and the notebook's header says the same, instead of a Colab link. Only `false` is written;
    # remove the key in the commit that moves repo.ref to a tag that contains the notebook.
    # A declared fact, not a git lookup, so generated files do not depend on which tags a
    # checkout has; tests/test_colab_ref.py checks it against git where repo.ref resolves.
    notebooks:
      - {path: labs/python/00-setup-warmup.ipynb, source: labs/src/00-setup-warmup.py, kernel: python3, install: [duckdb, pandas]}
      - {path: labs/r/00-setup-warmup.ipynb, source: labs/src/00-setup-warmup.R, kernel: ir, install: [duckdb, DBI, dplyr]}
    # deps: files whose change makes a run record stale (with the pins and repo.ref).
    # R files count only for R notebooks, src/ only for Python notebooks.
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, R/mktstats.R]
    data:
      - {name: "CDNOW transaction log", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/main/data/cdnow_transactions.csv", sha256: 7311ae0fb676e9f454bba310b10bc769b1a6838aeec09bd00175eb49481dddac}
  m01:
    slug: 01-customer-base
    title: "Transaction logs to customer-base analysis"
    day: d1
    minutes: {briefing: 45, lab: 50, debrief: 10}
    language: [python]
    language_why: "Python with DuckDB. SQL is what analytics engineers already write, and DuckDB runs it inside the notebook on Colab with no database server; the same queries work on a warehouse."
    summary: "Turn raw transaction logs into a customer table with DuckDB window functions, draw cohort retention curves, and see why churn is never observed when customers can leave without telling you."
    objectives:
      - "Clean a real transaction log in SQL: cancellations, missing customer IDs, returns and same-day purchases."
      - "Compute frequency, recency and customer age with window functions, using exactly the definitions the Module 2 models need."
      - "Build monthly cohort retention curves and read them without mixing up cohorts and calendar time."
      - "Explain why churn is unobserved in a non-contractual setting, and measure how often a 'no purchase in 90 days' rule misclassifies customers against known truth."
    outcomes:
      - "A reusable SQL query that turns any transaction log into an RFM table (frequency, recency, age, mean spend)"
      - "Cohort retention curves for CDNOW and UCI Online Retail II"
      - "A confusion table of a recency-rule churn flag against the synthetic retailer's true alive status"
    prerequisites:
      - "Module 0 (pre-work) or equivalent: pandas groupby or SQL GROUP BY"
      - "No prior use of SQL window functions; they are introduced here"
    decision: "Decide whether an 'inactive for N days' rule is good enough to stop retargeting customers, by counting how many still-active customers it would drop."
    recap: "Pre-work left you with per-customer counts but no definition of who is still a customer."
    next: "The recency rule needs an arbitrary cutoff, cannot forecast purchases and gives no probability. Module 2 replaces it with a model of purchasing and silent dropout."
    notebooks:
      - {path: labs/python/01-customer-base-sql.ipynb, source: labs/src/01-customer-base-sql.py, kernel: python3, install: [duckdb, pandas, matplotlib, openpyxl, pyarrow]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/_rfm.py, src/mktstats/synth/btyd.py, src/mktstats/synth/capstone.py, src/mktstats/synth/channels.py, src/mktstats/synth/email.py, src/mktstats/synth/geo.py, src/mktstats/synth/mmm.py]
    data:
      - {name: "UCI Online Retail II", url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip", sha256: 572e36277c2390fbfde10664750731e0a86f55e33470d91919085f0408e67bfb}
      - {name: "CDNOW transaction log", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/1.2.0/data/cdnow_transactions.csv", sha256: 7311ae0fb676e9f454bba310b10bc769b1a6838aeec09bd00175eb49481dddac}
      - {name: "Synthetic retailer (generated by mktstats.synth.retailer)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
  m02:
    slug: 02-btyd
    title: "Buy-till-you-die models: BG/NBD and Pareto/NBD"
    day: d1
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. PyMC-Marketing implements BG/NBD and Pareto/NBD with full posteriors, in the same library we use for the marketing mix model on Day 4."
    summary: "Model purchasing and silent dropout with BG/NBD and Pareto/NBD, check that the fit recovers known parameters, forecast a holdout period, and turn the probability a customer is alive into a retargeting rule."
    objectives:
      - "Simulate the BG/NBD generative story and say what each parameter (r, α, a, b) controls."
      - "Compute the sufficient statistics x (repeat purchases), t_x (time of last purchase since the first) and T (customer age) for a calibration period, without swapping them."
      - "Fit BG/NBD by MAP and by MCMC and check that the true parameters fall inside the 94% HDI."
      - "Compare predicted with actual holdout purchases on CDNOW for BG/NBD and Pareto/NBD."
      - "Set a P(alive) threshold for retargeting from the contact cost and the expected margin."
    outcomes:
      - "A parameter-recovery table: true value, MAP, posterior mean and 94% HDI"
      - "Holdout tracking plots for CDNOW (predicted versus actual repeat purchases)"
      - "A per-customer P(alive) and expected-purchases table with a retarget / stop flag"
    prerequisites:
      - "Module 1: the RFM table and why churn is unobserved"
      - "Poisson counts and exponential waiting times at the level of 'rate per week'"
    decision: "Stop retargeting customers whose P(alive) is below τ = contact cost ÷ (margin per purchase × assumed response rate), and count how many customers and dollars that affects."
    recap: "Module 1's recency rule flags churn with an arbitrary cutoff, cannot forecast, and misclassified still-active customers against the known truth."
    next: "These models treat all customers as one population: they cannot say whether customers from different acquisition channels buy or leave at different rates, and we have not tested whether a flexible machine-learning model forecasts better. Module 3 does both."
    notebooks:
      - {path: labs/python/02-btyd.ipynb, source: labs/src/02-btyd.py, kernel: python3, install: [pymc-marketing, nutpie, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, data/synthetic/bgnbd_transactions.csv, data/synthetic/bgnbd_rfm.csv, data/synthetic/truth.json]
    data:
      - {name: "CDNOW transaction log", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/1.2.0/data/cdnow_transactions.csv", sha256: 7311ae0fb676e9f454bba310b10bc769b1a6838aeec09bd00175eb49481dddac}
      - {name: "Synthetic BG/NBD cohort (generated by mktstats.synth.btyd_bgnbd)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
  m03:
    slug: 03-covariates-and-ml
    title: "Covariates in CLVTools, and BTYD versus machine learning"
    day: d1
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [r, python]
    language_why: "R for CLVTools, the reference implementation of the Pareto/NBD with covariates; Python for the machine-learning comparison with scikit-learn."
    summary: "Add the acquisition channel as a covariate to the Pareto/NBD in CLVTools and recover the true channel effects, then run a fair holdout comparison of BTYD against gradient boosting."
    objectives:
      - "Fit a Pareto/NBD with static covariates in CLVTools (clvdata, then SetStaticCovariates, then pnbd) and interpret the purchase and dropout coefficients."
      - "Check that the channel effects estimated on the synthetic retailer match the truth within their 90% confidence intervals."
      - "Compare CLVTools' fit with the Python fit from Module 2 on the same customers."
      - "Build features and a holdout target without leakage, and compare gradient boosting with BTYD on holdout purchases."
      - "State what each approach gives that the other cannot (P(alive) and extrapolation versus flexible features)."
    outcomes:
      - "A table of true versus estimated channel effects on purchase and dropout rates"
      - "A side-by-side of CLVTools and PyMC-Marketing parameter estimates"
      - "A holdout scorecard (error by customer group) for BTYD and gradient boosting, with the result you measured"
    prerequisites:
      - "Module 2: the Pareto/NBD and the calibration/holdout split"
      - "Linear or logistic regression coefficients as multiplicative effects (log scale)"
      - "Optional for the R notebook: R basics from the R pre-work notebook"
    decision: "Decide whether channels differ enough in purchase and dropout rates to be treated differently, and which method to use for next quarter's purchase forecast, based on the holdout error you measured."
    recap: "Module 2's models describe one homogeneous population and were never compared with a flexible machine-learning forecaster."
    next: "We now forecast how many purchases each customer will make, but not what they will spend, so we still cannot put a dollar value on a customer. Module 4 adds a spend model and discounting."
    notebooks:
      - {path: labs/r/03-clvtools-covariates.ipynb, source: labs/src/03-clvtools-covariates.R, kernel: ir, install: [CLVTools]}
      - {path: labs/python/03-btyd-vs-ml.ipynb, source: labs/src/03-btyd-vs-ml.py, kernel: python3, install: [pymc-marketing, scikit-learn, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/_rfm.py, src/mktstats/synth/btyd.py, src/mktstats/synth/capstone.py, src/mktstats/synth/channels.py, src/mktstats/synth/email.py, src/mktstats/synth/geo.py, src/mktstats/synth/mmm.py, R/mktstats.R, data/synthetic/retailer_transactions.csv, data/synthetic/retailer_customers.csv, data/synthetic/truth.json]
    data:
      - {name: "Synthetic retailer (generated by mktstats.synth.retailer)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
      - {name: "CDNOW transaction log", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/1.2.0/data/cdnow_transactions.csv", sha256: 7311ae0fb676e9f454bba310b10bc769b1a6838aeec09bd00175eb49481dddac}
      - {name: "CDNOW sample shipped with CLVTools (data(cdnow))", url: "https://cran.r-project.org/package=CLVTools"}
  m04:
    slug: 04-monetary-clv
    title: "Monetary value and dollar CLV"
    day: d2
    minutes: {briefing: 55, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. PyMC-Marketing's GammaGammaModel and ShiftedBetaGeoModel sit on the same posterior machinery as the Module 2 transaction models, so uncertainty can flow from purchases to dollars."
    summary: "Add a Gamma-Gamma spend model after checking that spend is independent of purchase frequency, compute discounted CLV with its uncertainty, test how it moves with horizon and discount rate, and handle the contractual case with the shifted-beta-geometric model."
    objectives:
      - "Check the Gamma-Gamma independence assumption with the correlation between frequency and mean spend among repeat buyers."
      - "Fit Gamma-Gamma and check that the true spend parameters (p, q, v) fall inside the 94% HDI."
      - "Compute discounted CLV with PyMC-Marketing, then write your own version that carries the uncertainty of both the purchase and the spend models."
      - "Show how CLV changes with the horizon in months and the monthly discount rate."
      - "Fit the shifted-beta-geometric (sBG) model to the Fader–Hardie retention data and project retention for later years."
    outcomes:
      - "A per-customer CLV table with posterior mean and 94% interval"
      - "A sensitivity grid of total CLV by horizon (12, 24, 36 months) and monthly discount rate"
      - "An sBG retention projection compared with the published survival percentages"
    prerequisites:
      - "Module 2: BG/NBD, expected purchases and P(alive)"
      - "Discounting a cash flow (net present value) at a monthly rate"
    decision: "Report what an average customer and the whole customer base are worth over 12 and 36 months with a 94% interval, and name the assumption (horizon, discount rate or spend model) that moves the number most."
    recap: "Module 3 forecasts purchases per customer, but there is no money in it yet."
    next: "A CLV number is not a decision: we have not turned it into the most we can pay to acquire a customer in each channel, or into whether a retention campaign pays back. Module 5 does."
    notebooks:
      - {path: labs/python/04-monetary-clv.ipynb, source: labs/src/04-monetary-clv.py, kernel: python3, install: [pymc-marketing, nutpie, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/recovery.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/_rfm.py, src/mktstats/synth/btyd.py, src/mktstats/synth/capstone.py, src/mktstats/synth/channels.py, src/mktstats/synth/email.py, src/mktstats/synth/geo.py, src/mktstats/synth/mmm.py, data/real/sbg_retention.csv]
    data:
      - {name: "CDNOW transaction log", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/1.2.0/data/cdnow_transactions.csv", sha256: 7311ae0fb676e9f454bba310b10bc769b1a6838aeec09bd00175eb49481dddac}
      - {name: "Fader & Hardie (2007) retention counts, Table 1 (committed as data/real/sbg_retention.csv)", url: "https://faculty.wharton.upenn.edu/wp-content/uploads/2012/04/Fader_hardie_jim_07.pdf"}
  m05:
    slug: 05-clv-decisions
    title: "From CLV to decisions"
    day: d2
    minutes: {briefing: 55, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. The posterior draws from Module 4 and the DuckDB warehouse write-back live in one notebook, which is how a scoring job would run in production."
    summary: "Turn posterior CLV into decisions: the most we can pay to acquire a customer in each channel, segment value with credible intervals, the break-even effect of a retention campaign and scores written to a warehouse table, with the numbers for a one-page CFO memo that you write in the afternoon clinic."
    objectives:
      - "Compute a customer acquisition cost (CAC) cap per channel from the posterior of new-customer CLV and a stated risk rule."
      - "Report segment value with 94% credible intervals and say which differences between segments are supported by the data."
      - "Find the retention improvement a campaign needs to break even, and judge whether it is plausible."
      - "Write customer scores (P(alive), CLV mean and interval, segment, model version, date) to a DuckDB table with a fixed schema."
      - "Collect the numbers, intervals and assumptions a one-page decision memo needs; the memo itself is written and peer-reviewed in the Day 2 clinic."
    outcomes:
      - "A CAC-cap table by acquisition channel, compared with the true new-customer CLV"
      - "A customer_scores table in a DuckDB 'warehouse' file"
      - "A memo template filled with the lab's numbers, from which you write the one-page CFO memo in the afternoon clinic"
    prerequisites:
      - "Module 4: discounted CLV with posterior draws"
      - "Module 3: acquisition channel as a covariate"
    decision: "Set the maximum CAC we can afford per acquisition channel, and decide whether to run the proposed retention campaign."
    recap: "Module 4 gives CLV with an interval, but a number on its own does not tell anyone what to spend."
    next: "CAC caps assume each channel caused the customers credited to it. Nothing so far tested that. Day 3 asks whether marketing causes sales, starting with randomized experiments in Module 6."
    notebooks:
      - {path: labs/python/05-clv-decisions.ipynb, source: labs/src/05-clv-decisions.py, kernel: python3, install: [pymc-marketing, nutpie, duckdb, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/recovery.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/_rfm.py, src/mktstats/synth/btyd.py, src/mktstats/synth/capstone.py, src/mktstats/synth/channels.py, src/mktstats/synth/email.py, src/mktstats/synth/geo.py, src/mktstats/synth/mmm.py]
    data: []
  m06:
    slug: 06-experiments
    title: "Experiments done right"
    day: d3
    minutes: {briefing: 55, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. NumPy, SciPy and statsmodels cover everything here, and each method is short enough to write from scratch and check."
    summary: "Design and read randomized experiments correctly: power and minimum detectable effect, sample-ratio checks, why peeking inflates false positives, CUPED variance reduction, delta-method standard errors for ratio metrics, and why attribution is not incrementality."
    objectives:
      - "Compute the sample size needed for a minimum detectable effect (MDE), and the MDE for a fixed sample."
      - "Detect a sample-ratio mismatch (SRM) with a chi-square test before reading any result."
      - "Simulate A/A tests with repeated peeking, measure the inflated false-positive rate, and calibrate a stricter threshold for a fixed number of looks."
      - "Reduce variance with CUPED using a pre-experiment covariate, and compute a delta-method standard error for a ratio metric."
      - "Show with a simulation why last-click attribution credits conversions that would have happened anyway."
    outcomes:
      - "A power and MDE calculator checked against simulation"
      - "A peeking simulation showing the false-positive rate under daily looks"
      - "An experiment readout for the email test (SRM check, CUPED-adjusted effect, 95% interval)"
    prerequisites:
      - "Linear regression and the standard error of a mean"
      - "Module 5: what a customer is worth, used to price the effect"
    decision: "Decide whether to roll out the email campaign: report incremental revenue per customer with a 95% confidence interval after the SRM check and CUPED, and compare it with the cost per email."
    recap: "Module 5 set CAC caps assuming channels cause the customers credited to them, but nothing so far measured causation."
    next: "Individuals cannot always be randomized: TV, outdoor and regional campaigns switch on for whole regions. Module 7 measures lift from geo-level tests and quasi-experiments."
    notebooks:
      - {path: labs/python/06-experiments.ipynb, source: labs/src/06-experiments.py, kernel: python3, install: [numpy, pandas, scipy, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, data/synthetic/email_experiment.csv, data/synthetic/truth.json]
    data:
      - {name: "Synthetic email experiment (20,000 customers, known effect)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/README.md"}
      - {name: "Hillstrom MineThatData e-mail experiment (64,000 customers)", url: "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv", sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece}
  m07:
    slug: 07-geo-experiments
    title: "Geo-experiments and quasi-experiments"
    day: d3
    minutes: {briefing: 55, lab: 55, debrief: 10}
    language: [python, r]
    language_why: "Python for difference-in-differences and synthetic control written from scratch with SciPy; R because CausalImpact (bsts) and GeoLift are R packages and the reference implementations (the Python port of CausalImpact has had no release since 2023)."
    summary: "Estimate the lift of a regional campaign with difference-in-differences and synthetic control written from scratch, test them with placebos and power simulations on a geo panel with known lift, compare with CausalImpact in R, and check the method on California's Proposition 99."
    objectives:
      - "Estimate a campaign effect with a two-period difference-in-differences and state the parallel-trends assumption it needs."
      - "Fit synthetic-control weights by constrained least squares with SciPy and estimate incremental sales."
      - "Run in-space placebo tests and compute a permutation p-value."
      - "Estimate the power of a geo test by simulation, injecting a known lift into pre-period data."
      - "Run CausalImpact on the same panel and compare its interval with the truth and with your synthetic control."
    outcomes:
      - "Your own did() and synthetic_control() functions, checked against the known lift"
      - "A placebo plot and a power curve for the retailer's geo test"
      - "A Prop 99 replication of the synthetic-control gap"
    prerequisites:
      - "Module 6: randomization, power and confidence intervals"
      - "Least squares regression"
    decision: "Was the campaign incremental, and by how much? Report incremental sales with an interval and the implied return on the campaign spend."
    recap: "Module 6 needs randomization of individuals, which is impossible for regional or broadcast campaigns."
    next: "A geo test measures one channel, once, in one window. To compare all channels continuously and plan budgets we need a model of how every channel drives sales over time: the marketing mix model in Module 8."
    # R install: GeoLift and augsynth come from their pinned archives (github_packages) after
    # their CRAN imports, which install.packages(repos = NULL) does not fetch by itself.
    notebooks:
      - {path: labs/python/07-synthetic-control-did.ipynb, source: labs/src/07-synthetic-control-did.py, kernel: python3, install: [numpy, pandas, scipy, matplotlib, threadpoolctl]}
      - {path: labs/r/07-causalimpact-geolift.ipynb, source: labs/src/07-causalimpact-geolift.R, kernel: ir, install: [CausalImpact, bsts, ggplot2, dplyr, tidyr, knitr, gsynth, MarketMatching, panelView, directlabels, doParallel, foreach, gridExtra, progress, lifecycle, osqp, FNN, Formula, augsynth, GeoLift]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, R/mktstats.R, data/synthetic/geo_panel.csv, data/synthetic/truth.json, data/real/prop99.csv]
    data:
      - {name: "Synthetic geo panel (40 geos x 104 weeks, known lift)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/README.md"}
      - {name: "Proposition 99 panel (tidysynth smoking data)", url: "https://cran.r-project.org/src/contrib/tidysynth_0.2.1.tar.gz", sha256: 046b416b437dd2f3d5610ac6a594db1c941c3cf9c208becfdfed0a76ce553281}
  m08:
    slug: 08-bayesian-mmm
    title: "Bayesian marketing mix models"
    day: d4
    minutes: {briefing: 50, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. PyMC-Marketing 1.2.0 is a Bayesian MMM that runs on Colab's CPU; Google's Meridian conflicts with it on package versions and its docs recommend a GPU (see DECISIONS.md)."
    summary: "Build a Bayesian marketing mix model (MMM) with adstock, saturation and seasonality in PyMC-Marketing, set priors from spend shares, check priors and posterior against the data, and report ROAS per channel with intervals against the known truth."
    objectives:
      - "Write geometric adstock and logistic saturation as functions and explain what the decay α and the saturation λ do."
      - "Set channel-coefficient priors from spend shares and run a prior predictive check."
      - "Fit the model with nutpie and check divergences, R-hat and effective sample size before reading any result."
      - "Compute ROAS per channel with a 94% HDI and check that the truth lies inside it for at least 3 of the 4 channels."
      - "Run the same workflow on a second dataset whose true parameters you do not know."
    outcomes:
      - "Your own adstock and saturation functions, checked against PyMC-Marketing's"
      - "A diagnostics table (divergences, R-hat, ESS) and prior and posterior predictive plots"
      - "A ROAS table with 94% HDIs next to the true ROAS"
    prerequisites:
      - "Linear regression with several predictors"
      - "Module 2: what a prior, a posterior and an HDI are, and MAP versus MCMC"
      - "Module 7: incremental sales as a counterfactual difference"
    decision: "Decide which channels pay back: list channels whose ROAS exceeds the break-even ROAS (1 ÷ gross margin) with posterior probability ≥ 0.9, channels below it with probability ≥ 0.9, and channels the data cannot yet decide."
    recap: "Module 7 measures one campaign in one window; it cannot compare channels or say what next month's budget will return."
    next: "An MMM fitted on observational data can credit a channel that merely follows demand, and fit the data well while getting ROAS wrong. Module 9 calibrates it with lift tests and validates it out of sample."
    notebooks:
      - {path: labs/python/08-bayesian-mmm.ipynb, source: labs/src/08-bayesian-mmm.py, kernel: python3, install: [pymc-marketing, nutpie]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, data/synthetic/mmm_weekly.csv, data/synthetic/truth.json]
    data:
      - {name: "Synthetic weekly MMM (mmm_weekly.csv, seed 2028)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_weekly.csv"}
      - {name: "PyMC-Marketing mmm_example.csv (simulated demo data)", url: "https://raw.githubusercontent.com/pymc-labs/pymc-marketing/1.2.0/data/mmm_example.csv", sha256: 320d299569b989c37facac5bda6a4ee2d661cb12e158ac5d80689c8cc3d37955}
  m09:
    slug: 09-mmm-calibration
    title: "Calibrating and validating an MMM"
    day: d4
    minutes: {briefing: 50, lab: 55, debrief: 10}
    language: [python, r]
    language_why: "Python for PyMC-Marketing's lift-test calibration and time-slice cross-validation; a short R notebook runs Meta's Robyn, an R package, for comparison."
    summary: "Feed geo-test results into the MMM as extra likelihood terms, validate it with time-slice cross-validation and parameter stability, and see what an MMM cannot identify, such as a channel whose spend follows demand."
    objectives:
      - "Show on synthetic data how a demand-following channel biases its ROAS in an uncalibrated MMM."
      - "Convert a geo-test result into a lift-test row (channel, x, Δx, Δy, σ) and add it to the model with add_lift_test_measurements."
      - "Compare ROAS intervals before and after calibration against the truth."
      - "Run time-slice cross-validation and judge out-of-sample error and parameter stability across folds."
      - "Name what the MMM cannot identify from these data, and the test that would resolve it."
    outcomes:
      - "A before/after table of ROAS intervals for the calibrated and uncalibrated model, next to the truth"
      - "A time-slice cross-validation scorecard and a parameter-stability plot"
      - "A decision table: which channels to act on now and which to test first, with the spend at stake and the channel for the next lift test"
      - "Robyn's marginal ROAS per channel across its five best models (R notebook)"
    prerequisites:
      - "Module 8: the Bayesian MMM and its diagnostics"
      - "Module 7: reading a geo-test result as incremental sales with an interval"
    decision: "Decide which channel's ROAS is reliable enough to move budget on now, and which channel needs a new lift test first."
    recap: "Module 8's MMM fits clean synthetic data and recovers the truth, but nothing in it guards against confounding."
    next: "A calibrated MMM says what each channel returned; it does not say how to split next quarter's budget given diminishing returns, constraints and uncertainty. Module 10 optimizes the allocation."
    notebooks:
      - {path: labs/python/09-mmm-calibration.ipynb, source: labs/src/09-mmm-calibration.py, kernel: python3, install: [pymc-marketing, nutpie]}
      # Robyn calls the Python library nevergrad through reticulate: the notebook's first cell
      # finds or installs it (pinned by environment/requirements.txt); the image has it.
      - {path: labs/r/09-robyn.ipynb, source: labs/src/09-robyn.R, kernel: ir, install: [Robyn, reticulate, ggplot2]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, R/mktstats.R, data/synthetic/mmm_confounded_weekly.csv, data/synthetic/mmm_confounded_lift_tests.csv, data/synthetic/mmm_confounded_latent.csv, data/synthetic/truth.json, environment/requirements.txt]
    data:
      - {name: "Synthetic weekly MMM with a demand-following channel (mmm_confounded_weekly.csv, seed 2028)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_confounded_weekly.csv"}
      - {name: "Synthetic dated lift tests (mmm_confounded_lift_tests.csv)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_confounded_lift_tests.csv"}
      - {name: "Robyn dt_simulated_weekly (simulated MMM demo data, bundled with Robyn 3.12.1)", url: "https://cran.r-project.org/package=Robyn"}
  m10:
    slug: 10-budget-allocation
    title: "Budget allocation under uncertainty"
    day: d4
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. The optimizer works directly on PyMC-Marketing's posterior draws, and SciPy's SLSQP, which you call yourself, is the algorithm the library uses."
    summary: "Turn response curves into a budget: write a constrained SLSQP allocator, compare it with PyMC-Marketing's optimizer, add minimum and maximum spend per channel, make the allocation robust to posterior uncertainty, and credit channels for the long-run value of the customers they bring."
    objectives:
      - "Derive steady-state response curves and marginal ROAS per channel from the posterior."
      - "Write a constrained allocator with scipy.optimize.minimize (SLSQP) and check it against the allocation that is optimal under the true parameters."
      - "Run PyMC-Marketing's budget optimizer with minimum and maximum bounds and reconcile it with your allocator."
      - "Evaluate allocations over posterior draws and choose one by a stated risk rule (mean versus 10% quantile of response)."
      - "Add a CLV-weighted term so channels that acquire more valuable customers get credit beyond short-run sales."
    outcomes:
      - "Your own allocate() function with bounds and a budget constraint"
      - "A comparison of your allocation, PyMC-Marketing's and the true optimum"
      - "Three allocations (mean, risk-averse, CLV-weighted) with expected sales and 94% intervals"
    prerequisites:
      - "Module 9: a calibrated MMM and its response curves"
      - "Module 5: CLV per acquisition channel"
      - "The idea of a constrained optimum (no calculus required beyond 'marginal return')"
    decision: "Recommend next quarter's weekly spend per channel within the agreed bounds, with expected incremental sales and a 94% interval, and show how the recommendation changes under a risk-averse or a CLV-weighted objective."
    recap: "Module 9 gives calibrated response curves but no rule for dividing a fixed budget among channels."
    next: "Allocation decides how much to spend per channel, not whom to reach. Module 11 asks which customers an offer actually changes."
    notebooks:
      - {path: labs/python/10-budget-allocation.ipynb, source: labs/src/10-budget-allocation.py, kernel: python3, install: [pymc-marketing, nutpie, scipy]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/synth/mmm.py, data/synthetic/mmm_weekly.csv, data/synthetic/mmm_lift_tests.csv, data/synthetic/truth.json]
    data:
      - {name: "Synthetic weekly MMM (mmm_weekly.csv, seed 2028)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_weekly.csv"}
      - {name: "Synthetic lift tests (mmm_lift_tests.csv)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_lift_tests.csv"}
  m11:
    slug: 11-uplift
    title: "Uplift and heterogeneous treatment effects"
    day: d5
    minutes: {briefing: 50, lab: 55, debrief: 10}
    language: [r, python]
    language_why: "R for grf, the reference implementation of causal forests and of RATE; Python for EconML's double machine learning causal forest and the meta-learners."
    summary: "Estimate who responds to an email offer because of it, with causal forests (grf in R, EconML in Python) and meta-learners, evaluate targeting rules with Qini curves and RATE on held-out data, and target only where the expected incremental margin exceeds the offer cost."
    objectives:
      - "Explain why predicting who buys is not the same as predicting who buys because of the offer (uplift)."
      - "Fit a causal forest in grf and report the average treatment effect with a doubly robust 95% interval."
      - "Evaluate a targeting rule on held-out data with rank_average_treatment_effect (RATE and its TOC curve) and with a Qini curve."
      - "Fit EconML's CausalForestDML and S-, T- and X-learners, and compare their effect estimates with the true effects in the synthetic experiment."
      - "Turn effect estimates into a targeting list where incremental margin exceeds offer cost, and compare its profit with mailing everyone or no one."
    outcomes:
      - "An ATE and a RATE/TOC readout for the Hillstrom email test"
      - "Qini curves on held-out data for four uplift models"
      - "A targeting list with expected incremental profit against 'mail all' and 'mail none'"
    prerequisites:
      - "Module 6: randomized experiments and confidence intervals"
      - "Random forests or gradient boosting at the level of fit and predict"
    decision: "Send the offer only to customers whose expected incremental margin exceeds the offer cost; report how many that is and the incremental profit compared with mailing everyone."
    recap: "Module 10 decides how much to spend per channel but treats every customer the same."
    next: "Each module so far answers one question with its own data. The capstone (Module 12) joins them into one pipeline and one decision brief."
    # Both notebooks are done in the one lab slot: open the Python notebook first (its install
    # takes longest), work Part A in R, then Part B and the decision in Python.
    notebooks:
      - {path: labs/r/11-grf-causal-forest.ipynb, source: labs/src/11-grf-causal-forest.R, kernel: ir, install: [grf]}
      - {path: labs/python/11-uplift-econml.ipynb, source: labs/src/11-uplift-econml.py, kernel: python3, install: [econml, scikit-learn, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/uplift.py, src/mktstats/data.py, R/mktstats.R, data/synthetic/email_experiment.csv, data/synthetic/truth.json]
    data:
      - {name: "Hillstrom MineThatData e-mail test (64,000 customers; downloaded, not stored here)", url: "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv", sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece}
      - {name: "Synthetic e-mail experiment with true effects (data/synthetic/email_experiment.csv, truth.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/email_experiment.csv"}
  m12:
    slug: 12-capstone
    title: "Capstone: one decision pipeline for the retailer"
    day: d5
    # Briefing 15 min, pair work in two segments around lunch (see days.d5.blocks), presentations.
    minutes: {briefing: 15, lab: 180, debrief: 60}
    language: [python]
    language_why: "Python, so the whole pipeline runs in one notebook on one runtime; results from the R notebooks (Modules 3, 7 and 11) can be carried in as numbers."
    summary: "In pairs, run the whole pipeline on the synthetic retailer (CLV by channel, a geo-test readout, a calibrated MMM, a budget allocation and uplift targeting) and present a five-slide decision brief with its uncertainty."
    objectives:
      - "Chain the week's methods into one reproducible notebook in which each stage's output feeds the next."
      - "Check each stage against the synthetic truth before building on it."
      - "Combine CLV, the calibrated MMM and uplift estimates into one budget and one targeting rule."
      - "Present a decision with its interval, its assumptions and the next test you would run, in five slides."
    outcomes:
      - "One notebook that runs the pipeline end to end, with a checkpoint at every stage"
      - "A five-slide decision brief, presented and scored against the rubric"
    prerequisites:
      - "Modules 2–5 and 7–11, whose notebooks are the building blocks: Stage 1 reuses Modules 2–5, Stage 2 Module 7, Stage 3 Modules 8–9, Stage 4 Module 10 and Stage 5 Module 11"
    decision: "Recommend next quarter's budget by channel and the customers to target with the retention offer, with expected value, a 94% interval and the main risk to the recommendation."
    recap: "Modules 1–11 each answer one question in isolation, each with its own data and its own notebook."
    next: "After the workshop: run the same pipeline on your own data, starting with the Module 1 SQL on your transaction log."
    notebooks:
      - {path: labs/python/12-capstone.ipynb, source: labs/src/12-capstone.py, kernel: python3, install: [pymc-marketing, nutpie, econml, scikit-learn, scipy, threadpoolctl, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/recovery.py, src/mktstats/synth/channels.py, src/mktstats/synth/mmm.py, data/synthetic/capstone_transactions.csv, data/synthetic/capstone_customers.csv, data/synthetic/capstone_geo_panel.csv, data/synthetic/capstone_mmm_weekly.csv, data/synthetic/capstone_email_experiment.csv, data/synthetic/truth.json]
    data:
      - {name: "Synthetic capstone scenario (capstone_*.csv, mktstats.synth.capstone, seed 2032; scenario and hidden answers in truth.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
  m13:
    slug: 13-messy-real-data
    title: "Messy real data: cleaning a real log for BTYD and spend models"
    day: d6
    optional: true
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python with DuckDB SQL for the cleaning rules, as in Module 1 (an ASOF join matches each cancellation to the purchase it cancels); maximum-likelihood fits of the closed-form likelihoods for the many what-if fits; and PyMC-Marketing once, to confirm that fit, as in Modules 2 and 4."
    summary: "Build a cleaning pipeline that reproduces a known clean answer on a deliberately dirtied copy of the synthetic retailer, measure how much each data error moves BG/NBD, Gamma-Gamma and individual customer scores, cap extreme orders, and apply the same pipeline to UCI Online Retail II to choose whom to contact."
    objectives:
      - "Write SQL rules that flag non-product lines, exact duplicate lines, and cancellations together with the purchases they cancel, and show that they reproduce the clean RFM table of the synthetic retailer exactly."
      - "Measure, one rule at a time, how leaving each error in moves BG/NBD and Gamma-Gamma estimates, total expected revenue and individual customer scores, against the clean answer and the known truth."
      - "Cap extreme order values at a stated percentile and show what the cap does to the spend parameters and to the value of the capped wholesale customers."
      - "Fit BG/NBD and Gamma-Gamma to cleaned UCI Online Retail II, check them on a holdout period, and test the spend-independence assumption with Pearson and rank correlations."
      - "Turn the fitted models into a retention-contact list and report which cleaning or counting choice moves it most."
    outcomes:
      - "A tested DuckDB cleaning pipeline that turns an Online-Retail-II-style line log into purchase days and an RFM table"
      - "A table of how each data error moves model parameters, total expected revenue and individual scores, against known truth"
      - "A capping comparison for the spend model, with what it costs the wholesale customers' value"
      - "Holdout tracking, an independence check and a retention-contact list for Online Retail II, with how much each cleaning or counting choice moves the list"
    prerequisites:
      - "Module 1: cleaning Online Retail II in SQL, purchase days and the RFM table"
      - "Module 2: BG/NBD, the calibration/holdout split and MAP fits"
      - "Module 4: Gamma-Gamma, its independence assumption and expected spend per customer"
      - "Helpful: Module 5's break-even lift for a retention campaign"
    decision: "Decide which Online Retail II customers get a retention contact (when the assumed lift times margin times expected 26-week revenue exceeds the contact cost), and state which cleaning or counting choice moves that list most and by how many customers."
    recap: "Module 1 cleaned Online Retail II with three rules checked only by row counts, and Modules 2 and 4 fitted curated or synthetic logs; nothing showed whether the cleaning was right or what a cleaning error does to a model or a decision."
    next: "Module 14 turns to subscribers, whose churn is observed: survival models with censoring and covariates."
    notebooks:
      - {path: labs/python/13-messy-real-data.ipynb, source: labs/src/13-messy-real-data.py, kernel: python3, install: [pymc-marketing, duckdb, matplotlib, pyarrow, openpyxl], in_ref: false}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/synth/_rfm.py, src/mktstats/synth/messy.py, src/mktstats/mle.py, data/synthetic/messy_lines.csv, data/synthetic/truth_messy.json, data/synthetic/retailer_transactions.csv, data/synthetic/truth.json]
    data:
      - {name: "UCI Online Retail II", url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip", sha256: 572e36277c2390fbfde10664750731e0a86f55e33470d91919085f0408e67bfb}
      - {name: "Synthetic messy log (messy_lines.csv: the retailer's customers 1-2,500 and 13 wholesale buyers, dirtied by mktstats.synth.messy, seed 2033; error labels only in truth_messy.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
      - {name: "Synthetic retailer, the clean answer (generated by mktstats.synth.retailer)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
  m14:
    slug: 14-survival-churn
    title: "Survival analysis for subscription churn"
    day: d6
    optional: true
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "The lifelines library fits Kaplan-Meier curves, log-rank tests, Cox models, proportional-hazards tests and restricted mean survival time on pandas data frames. No model is sampled, so the fits are quick."
    summary: "Estimate subscriber retention from right-censored data with Kaplan-Meier, see where it stops and Module 4's sBG model has to take over, adjust a confounded comparison with a Cox proportional-hazards model, find an effect that fades with tenure, and turn the effect of onboarding into months of subscription and dollars."
    objectives:
      - "Write the Kaplan-Meier estimator, match lifelines' KaplanMeierFitter, and show against the known truth that two retention rates that ignore censoring miss in opposite directions."
      - "Show on the Fader-Hardie data that Kaplan-Meier reproduces observed retention but cannot extrapolate past the last observed year, while the sBG model from Module 4 can."
      - "Fit a Cox proportional-hazards model and check that, once plan is adjusted for, the true hazard ratios of plan and onboarding lie inside their 95% confidence intervals."
      - "Test the proportional-hazards assumption, find the covariate whose effect fades, and estimate its hazard ratio before and after a 3-month landmark."
      - "Compute the restricted mean survival time that onboarding adds within 24 months, standardized by plan, with a 95% bootstrap interval."
    outcomes:
      - "Your own Kaplan-Meier function, checked against lifelines and the true retention curve"
      - "A hazard-ratio table with and without adjustment for plan, next to the true hazard ratios"
      - "Hazard ratios before and after a landmark for an effect that fades"
      - "The months of subscription onboarding adds, priced against the cost of an onboarding call"
    prerequisites:
      - "Module 4: the shifted-beta-geometric model and contractual churn"
      - "Logistic regression coefficients read as multiplicative effects"
      - "Module 6: confidence intervals, and why a randomized comparison is causal"
    decision: "Decide whether an onboarding call is worth its cost, from the months of subscription that onboarding adds within 24 months (standardized by plan, with a 95% interval), the monthly margin and the share of called subscribers the call gets to onboard, and say why the estimate stays an association until an experiment tests it."
    recap: "Module 4's sBG model describes one cohort that joined on the same day and has no covariates; it cannot use subscribers who joined at different dates and are still active, or say which subscribers churn faster."
    next: "Onboarding was not randomized: adjusting for plan removes one confounder, but motivation is not in the data, so the effect is still an association. Module 15 estimates causal effects from observational data; a randomized pilot (Module 6) settles it."
    notebooks:
      - {path: labs/python/14-survival-churn.ipynb, source: labs/src/14-survival-churn.py, kernel: python3, install: [lifelines, matplotlib], in_ref: false}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/survival.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/subscriptions.py, data/synthetic/subscriptions_subscribers.csv, data/synthetic/truth_subscriptions.json, data/real/sbg_retention.csv]
    data:
      - {name: "Synthetic subscription program (subscriptions_subscribers.csv, generated by mktstats.synth.subscriptions, seed 2034; truth in truth_subscriptions.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
      - {name: "Fader & Hardie (2007) retention counts, Table 1 (committed as data/real/sbg_retention.csv)", url: "https://faculty.wharton.upenn.edu/wp-content/uploads/2012/04/Fader_hardie_jim_07.pdf"}
  m15:
    slug: 15-double-ml
    title: "Causal effects without an experiment: double machine learning"
    day: d6
    optional: true
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. EconML's LinearDML, the double machine learning estimator, takes any scikit-learn model for its two prediction steps; the lab uses scikit-learn's histogram gradient boosting, as in Module 11, and statsmodels for the regression baseline."
    summary: "Estimate how much installing the app, which customers chose for themselves, changed their next 26 weeks of spend: see a naive comparison and a regression with controls miss the known truth, write double machine learning with cross-fitting by hand, find out whose effect the estimate describes, then reproduce it with EconML's LinearDML and check the method against a randomized benchmark built from the Hillstrom experiment."
    objectives:
      - "Show, against a known true effect, how self-selection biases a naive comparison and a regression with linear controls."
      - "Write double machine learning by hand: cross-fitted predictions of install and spend from the covariates, then a regression of residual on residual with a 95% confidence interval."
      - "Check overlap with propensity scores, trim, and state which customers the estimate describes."
      - "Fit the same estimator with EconML's LinearDML, using the same folds and gradient-boosting models, and compare it with yours."
      - "Recover a randomized benchmark from a deliberately confounded sample of the Hillstrom experiment, and show how hiding one confounder biases the estimate."
    outcomes:
      - "Your own cross_fit() and dml_estimate() functions, checked against the true effect and against EconML"
      - "An overlap plot, a trimmed estimate and a profile of the customers the estimate describes"
      - "Naive, regression and double machine learning estimates next to the Hillstrom experimental benchmark"
      - "A break-even credit per install, with the hidden confounder that would overturn it"
    prerequisites:
      - "Module 6: randomized experiments and 95% confidence intervals"
      - "Module 11: treatment effects and EconML"
      - "Linear regression with control variables; gradient boosting at the level of fit and predict"
    decision: "Decide whether a credit paid to customers for installing the app pays back within 26 weeks, from the incremental margin per persuaded install and its 95% confidence interval, and name the unobserved confounder that could overturn the decision."
    recap: "Modules 6, 7 and 11 estimate effects of things the company randomized or switched on; installing an app, joining a loyalty program or finishing onboarding (Module 14) are chosen by customers, and the customers who choose them differ from those who do not."
    next: "Module 16 looks at another observational claim made every day: the credit multi-touch attribution gives each channel."
    notebooks:
      - {path: labs/python/15-double-ml.ipynb, source: labs/src/15-double-ml.py, kernel: python3, install: [econml, scikit-learn, statsmodels, matplotlib], in_ref: false}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/dml.py, src/mktstats/synth/_common.py, src/mktstats/synth/app_install.py, data/synthetic/app_install_customers.csv, data/synthetic/truth_app_install.json]
    data:
      - {name: "Synthetic app-install customers: 20,000 customers who chose whether to install the retailer's app, with each customer's true propensity and true effect (app_install_customers.csv from mktstats.synth.app_install, seed 2035; truth in truth_app_install.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
      - {name: "Hillstrom MineThatData e-mail experiment (64,000 customers; downloaded, not stored here)", url: "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv", sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece}
  m16:
    slug: 16-multi-touch-attribution
    title: "Multi-touch attribution: Markov chains, Shapley values and incrementality"
    day: d6
    optional: true
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Written from scratch with NumPy and pandas: you write the transition matrix, the removal effect and exact Shapley values over five channels (32 coalitions) and check each by hand; the absorbing-chain solve is provided. ChannelAttribution 2.2.5 (checked 2026-10-10) has heuristics and Markov models but no Shapley values, and on PyPI it ships as source only, so it would compile in the install cell."
    summary: "Credit conversions to channels along user journeys with last-click, first-click, linear, a Markov-chain removal effect and Shapley values, then score every method against the conversions each channel truly causes in a simulation where some channels reach users who were likely to buy anyway."
    objectives:
      - "Compute last-click, first-click and linear credit from journey paths, and check each on a five-journey example worked by hand."
      - "Estimate a first-order Markov transition matrix from journeys and compute each channel's removal effect from the probability of reaching conversion."
      - "Compute exact Shapley values from the conversion rates of channel sets and verify the efficiency, symmetry and null-player properties."
      - "Score five attribution methods against each channel's true incremental conversions, with 95% bootstrap intervals, and explain why targeted exposure and the efficiency property keep credit away from incrementality."
      - "Decide, with Module 6's minimum detectable effect, whether a holdout test should come before any budget move."
    outcomes:
      - "Your own heuristic_credit(), transition_matrix(), removal_effects() and shapley_values() functions, each checked on a hand-worked example"
      - "A table of credited conversions under five methods next to the true incremental conversions, with 95% bootstrap intervals"
      - "A test-or-move recommendation for retargeting, with the holdout's minimum detectable effect and the margin at risk"
    prerequisites:
      - "Module 6: the minimum detectable effect, and why attribution is not incrementality"
      - "Module 8: ROAS per channel from a marketing mix model"
    decision: "Decide whether to move budget toward the paid channel that data-driven attribution says is cheapest per conversion or to run a holdout test first, by checking that the holdout can detect the channel's break-even number of incremental conversions."
    recap: "Module 6 showed with one randomized email test that last-touch credit counts conversions that would have happened anyway; data-driven multi-touch attribution shares credit across every touch in a journey instead, but nothing so far tested whether that credit measures what a channel causes."
    next: "Attribution cannot tell a channel's effect from the intent of the users it reaches; experiments (Modules 6 and 7) and lift-calibrated MMMs (Module 9) can. Module 17 returns to the MMM, where a channel's effect can drift over time."
    notebooks:
      - {path: labs/python/16-multi-touch-attribution.ipynb, source: labs/src/16-multi-touch-attribution.py, kernel: python3, install: [numpy, pandas, scipy, matplotlib], in_ref: false}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/attribution.py, src/mktstats/synth/_common.py, src/mktstats/synth/mta.py, data/synthetic/mta_journeys.csv, data/synthetic/truth_mta.json]
    data:
      - {name: "Synthetic user journeys with targeted exposure: 69,410 journeys of 100,000 users over five channels, with each channel's true incremental conversions (mta_journeys.csv from mktstats.synth.mta, seed 2036, one letter per touch; truth in truth_mta.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
  m17:
    slug: 17-mmm-time-varying
    title: "MMM with drifting effects and a Prophet baseline"
    day: d6
    optional: true
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "PyMC-Marketing 1.2.0 fits the MMM with a separate time-varying effectiveness multiplier for each channel (a Hilbert-space Gaussian process); Prophet 1.4.0, preinstalled on Colab, builds the trend, seasonality and holiday baseline that Robyn also builds from it."
    summary: "Find and model a channel whose effect per dollar fades (ad fatigue): show that a static MMM reports its all-period average as if it held today, detect the drift from the static model's residuals, estimate the decline with a time-varying MMM, and test against the truth what a Prophet baseline fitted to sales does to channel ROAS."
    objectives:
      - "Compute ROAS over a window and show, against the truth, that a static MMM gives the fading channel about the same ROAS for the last quarter as for the whole history."
      - "Detect a drifting effect without the truth, from the year-by-year correlation between a static model's residuals and each channel's spend."
      - "Fit an MMM with a time-varying multiplier per channel in PyMC-Marketing, check what drift its prior allows, and measure in what share of weeks the true path lies inside the 94% HDI."
      - "Feed Prophet's trend, seasonality and holiday components into the MMM as an informed prior and measure, against the truth, how each channel's ROAS moves."
      - "Decide on next quarter's budget for the fading channel from its current-quarter ROAS interval against break-even, and say how that differs from the all-period answer."
    outcomes:
      - "A window-ROAS function that works on the truth and on posterior draws"
      - "A residual check that flags a drifting channel when no truth is available"
      - "A plot of the estimated effectiveness path with its 94% HDI band next to the true path"
      - "A table of ROAS with the MMM's own baseline and with Prophet's, next to the truth"
      - "A cut-or-keep recommendation for the fading channel with the probability that it is right"
    prerequisites:
      - "Module 8: the Bayesian MMM, adstock, saturation, ROAS and the sampler diagnostics"
      - "Module 9: what an MMM cannot identify, and lift tests in the model's units"
    decision: "Decide whether to cut the fading channel's budget next quarter (social, in the lab): cut if its current-quarter ROAS is below break-even (1 ÷ gross margin) with posterior probability ≥ 0.9, keep if above with probability ≥ 0.9, otherwise run a lift test first; and say how this differs from the answer the all-period average gives."
    recap: "Modules 8 to 10 assume each channel's effect per dollar is the same in every week of the history, so a channel that has worn out keeps the average ROAS of its good years."
    next: "This is the last extension. A drift estimated from observational data is still an estimate: a lift test run now (Module 9) checks the current level, and Module 10's optimizer can take the current-quarter response curves instead of the all-period ones."
    notebooks:
      - {path: labs/python/17-mmm-time-varying.ipynb, source: labs/src/17-mmm-time-varying.py, kernel: python3, install: [pymc-marketing, nutpie, prophet, matplotlib], in_ref: false}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/data.py, src/mktstats/drift.py, src/mktstats/synth/__init__.py, src/mktstats/synth/_common.py, src/mktstats/synth/mmm.py, src/mktstats/synth/mmm_drift.py, data/synthetic/mmm_drift_weekly.csv, data/synthetic/mmm_drift_latent.csv, data/synthetic/mmm_drift_lift_tests.csv, data/synthetic/truth_mmm_drift.json]
    data:
      - {name: "Synthetic weekly MMM with a fading channel: 156 weeks of sales and spend on four channels, social's effect per dollar falling to about 0.4 of its first-year level (mmm_drift_weekly.csv from mktstats.synth.mmm_drift, seed 2037; noiseless paths in mmm_drift_latent.csv, truth in truth_mmm_drift.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/tree/main/data/synthetic"}
      - {name: "Synthetic dated lift test on the fading channel (mmm_drift_lift_tests.csv, one +30% social test ending 2025-11-17; stretch A)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/mmm_drift_lift_tests.csv"}

# Evidence rules for readiness.qmd (scripts/readiness.py). Envs with teaching: true count as
# "ran on the runtime it is designed for"; ci: true is the CI lane; documented_only envs are
# never run and are labelled so.
readiness:
  max_run_age_days: 21
  envs:
    colab-py: {label: "Colab (Python runtime, CPU)", teaching: true, kernel: python3}
    colab-r: {label: "Colab (R runtime, CPU)", teaching: true, kernel: ir}
    ci-amd64: {label: "GitHub Actions runner in the workshop image (linux/amd64, 4 vCPU)", ci: true}
    docker-arm64: {label: "Workshop image on an Apple Silicon laptop (linux/arm64, Docker)"}
    macos-arm64: {label: "Apple Silicon laptop, native uv environment (not Linux)"}
    aws-sagemaker: {label: "AWS SageMaker Studio (custom image)", documented_only: true}
    aws-ec2: {label: "AWS EC2 (workshop image over an SSH tunnel)", documented_only: true}
  items: []
