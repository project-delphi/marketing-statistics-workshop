    data: []
  m10:
    slug: 10-budget-allocation
    title: "Budget allocation under uncertainty"
    day: d4
    minutes: {briefing: 45, lab: 55, debrief: 10}
    language: [python]
    language_why: "Python. The optimizer works directly on PyMC-Marketing's posterior draws, and SciPy's SLSQP, which you call yourself, is the algorithm the library uses."
    summary: "Turn response curves into a budget: write a constrained SLSQP allocator, compare it with PyMC-Marketing's optimizer, add minimum and maximum spend per channel, make the allocation robust to posterior uncertainty, and credit channels for the long-run value of the customers they bring."
    objectives:
      - "Derive steady-state response curves and marginal ROAS per channel from the posterior."
      - "Write a constrained allocator with scipy.optimize.minimize (SLSQP) and check it against the allocation that is optimal under the true parameters."
      - "Run PyMC-Marketing's budget optimizer with minimum and maximum bounds and reconcile it with your allocator."
      - "Evaluate allocations over posterior draws and choose one by a stated risk rule (mean versus 10% quantile of response)."
      - "Add a CLV-weighted term so channels that acquire more valuable customers get credit beyond short-run sales."
    outcomes:
      - "Your own allocate() function with bounds and a budget constraint"
      - "A comparison of your allocation, PyMC-Marketing's and the true optimum"
      - "Three allocations (mean, risk-averse, CLV-weighted) with expected sales and 94% intervals"
    prerequisites:
      - "Module 9: a calibrated MMM and its response curves"
      - "Module 5: CLV per acquisition channel"
      - "The idea of a constrained optimum (no calculus required beyond 'marginal return')"
    decision: "Recommend next quarter's weekly spend per channel within the agreed bounds, with expected incremental sales and a 94% interval, and show how the recommendation changes under a risk-averse or a CLV-weighted objective."
    recap: "Module 9 gives calibrated response curves but no rule for dividing a fixed budget among channels."
    next: "Allocation decides how much to spend per channel, not whom to reach. Module 11 asks which customers an offer actually changes."
    notebooks:
      - {path: labs/python/10-budget-allocation.ipynb, source: labs/src/10-budget-allocation.py, kernel: python3}
    deps: []
    data: []
  m11:
    slug: 11-uplift
    title: "Uplift and heterogeneous treatment effects"
    day: d5
    minutes: {briefing: 50, lab: 55, debrief: 10}
    language: [r, python]
    language_why: "R for grf, the reference implementation of causal forests and of RATE; Python for EconML's double machine learning causal forest and the meta-learners."
    summary: "Estimate who responds to an email offer because of it, with causal forests (grf in R, EconML in Python) and meta-learners, evaluate targeting rules with Qini curves and RATE on held-out data, and target only where the expected incremental margin exceeds the offer cost."
    objectives:
      - "Explain why predicting who buys is not the same as predicting who buys because of the offer (uplift)."
      - "Fit a causal forest in grf and report the average treatment effect with a doubly robust 95% interval."
      - "Evaluate a targeting rule on held-out data with rank_average_treatment_effect (RATE and its TOC curve) and with a Qini curve."
      - "Fit EconML's CausalForestDML and S-, T- and X-learners, and compare their effect estimates with the true effects in the synthetic experiment."
      - "Turn effect estimates into a targeting list where incremental margin exceeds offer cost, and compare its profit with mailing everyone or no one."
    outcomes:
      - "An ATE and a RATE/TOC readout for the Hillstrom email test"
      - "Qini curves on held-out data for four uplift models"
      - "A targeting list with expected incremental profit against 'mail all' and 'mail none'"
    prerequisites:
      - "Module 6: randomized experiments and confidence intervals"
      - "Random forests or gradient boosting at the level of fit and predict"
    decision: "Send the offer only to customers whose expected incremental margin exceeds the offer cost; report how many that is and the incremental profit compared with mailing everyone."
    recap: "Module 10 decides how much to spend per channel but treats every customer the same."
    next: "Each module so far answers one question with its own data. The capstone (Module 12) joins them into one pipeline and one decision brief."
    # Both notebooks are done in the one lab slot: open the Python notebook first (its install
    # takes longest), work Part A in R, then Part B and the decision in Python.
    notebooks:
      - {path: labs/r/11-grf-causal-forest.ipynb, source: labs/src/11-grf-causal-forest.R, kernel: ir, install: [grf]}
      - {path: labs/python/11-uplift-econml.ipynb, source: labs/src/11-uplift-econml.py, kernel: python3, install: [econml, scikit-learn, matplotlib]}
    deps: [src/mktstats/__init__.py, src/mktstats/harness.py, src/mktstats/runtime.py, src/mktstats/checks.py, src/mktstats/uplift.py, src/mktstats/data.py, R/mktstats.R, data/synthetic/email_experiment.csv, data/synthetic/truth.json]
    data:
      - {name: "Hillstrom MineThatData e-mail test (64,000 customers; downloaded, not stored here)", url: "http://www.minethatdata.com/Kevin_Hillstrom_MineThatData_E-MailAnalytics_DataMiningChallenge_2008.03.20.csv", sha256: 0e5893329d8b93cefecc571777672028290ab69865718020c78c7284f291aece}
      - {name: "Synthetic e-mail experiment with true effects (data/synthetic/email_experiment.csv, truth.json)", url: "https://github.com/project-delphi/marketing-statistics-workshop/blob/main/data/synthetic/email_experiment.csv"}
  m12:
    slug: 12-capstone
    title: "Capstone: one decision pipeline for the retailer"
    day: d5
    # Briefing 15 min, pair work in two segments around lunch (see days.d5.blocks), presentations.
    minutes: {briefing: 15, lab: 180, debrief: 60}
    language: [python]
    language_why: "Python, so the whole pipeline runs in one notebook on one runtime; results from the R notebooks (Modules 3, 7 and 11) can be carried in as numbers."
    summary: "In pairs, run the whole pipeline on the synthetic retailer (CLV by channel, a geo-test readout, a calibrated MMM, a budget allocation and uplift targeting) and present a five-slide decision brief with its uncertainty."
    objectives:
      - "Chain the week's methods into one reproducible notebook in which each stage's output feeds the next."
      - "Check each stage against the synthetic truth before building on it."
      - "Combine CLV, the calibrated MMM and uplift estimates into one budget and one targeting rule."
      - "Present a decision with its interval, its assumptions and the next test you would run, in five slides."
    outcomes:
